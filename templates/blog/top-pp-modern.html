<div class="card">
    <h3 class="card-title flex items-center gap-2 mb-4">
        {{ _('Top users') }}
        <svg class="w-5 h-5 text-accent-600" fill="currentColor" viewBox="0 0 20 20">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
        </svg>
    </h3>

    <div class="overflow-x-auto">
        <table class="table table-compact w-full">
            <thead>
                <tr>
                    <th class="w-12">#</th>
                    <th>{{ _('Username') }}</th>
                    <th class="text-right">{{ _('Points') }}</th>
                </tr>
            </thead>
            <tbody>
                {% for user in top_pp_users %}
                    <tr>
                        <td class="font-bold text-gray-600">{{ loop.index }}</td>
                        <td>{{ link_user(user) }}</td>
                        <td class="text-right font-mono text-sm">
                            {{ user.performance_points|floatformat(2) }}
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="flex items-center justify-between pt-3 mt-3 border-t border-gray-200 text-sm">
        <a href="{{ url('organization_list') }}" class="text-primary-600 hover:text-primary-700 font-medium">
            {{ _('Organizations') }}
        </a>
        <a href="{{ url('user_list') }}" class="text-primary-600 hover:text-primary-700 font-medium">
            {{ _('View all') }} →
        </a>
    </div>
</div>
